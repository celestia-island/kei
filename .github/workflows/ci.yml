name: CI
on:
  workflow_dispatch:

jobs:
  check-bsp:
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly

  fmt:
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 60
    env:
      # Override rust-toolchain.toml so fmt uses stable (nightly's rustfmt
      # is not always available for pinned toolchains).
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
