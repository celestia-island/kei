name: Deploy Documentation

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      # The English landing page IS the repository-root README: docs/en/README.md is
      # a symlink (mode 120000) to ../../README.md, so a change to the root README
      # alters the rendered site without touching anything under docs/. Without this
      # entry such a change left the published page stale until some other docs file
      # happened to change.
      - 'README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --git https://github.com/celestia-island/lagrange --branch master lagrange-library --locked
      - run: lagrange build --src docs --out _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
