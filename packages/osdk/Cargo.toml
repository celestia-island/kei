[package]
name = "cargo-osdk"
version = "0.18.0"
edition = "2024"
description = "Accelerate OS development with Asterinas OSDK"
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/asterinas/asterinas"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

linux-bzimage-builder = { version = "0.18.0", path = "../ostd/libs/linux-bzimage/builder" }

chrono = "^0.4"
clap = { version = "^4", features = ["cargo", "derive"] }
env_logger = "^0.11"
indexmap = "^2"
indicatif = "^0.17" # For a commandline progress bar
inferno = "^0.11"
log = "^0.4"
quote = "^1"
regex = "^1"
rev_buf_reader = "^0.3"
rustc_version = "^0.4"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
shlex = "^1"
syn = { version = "^2", features = ["extra-traits", "full", "parsing", "printing"] }
tempfile = "^3"
toml = { version = "^0.8", features = ["preserve_order"] }
which = "^8"
whoami = "^1"
[dev-dependencies]

assert_cmd = "^2"
