[package]
name = "kei-webui"
version = "0.1.0"
edition = "2024"
description = "kei OS webui — browser-based dashboard connecting to kei WS JSON-RPC"
publish = false
authors = ["kei contributors"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

hikari-components = { git = "https://github.com/celestia-island/hikari.git", branch = "master", package = "hikari-components" }
hikari-icons = { git = "https://github.com/celestia-island/hikari.git", branch = "master", package = "hikari-icons", features = ["tairitsu"] }
hikari-palette = { git = "https://github.com/celestia-island/hikari.git", branch = "master", package = "hikari-palette" }
tairitsu-hooks = { git = "https://github.com/celestia-island/tairitsu.git", branch = "master", package = "tairitsu-hooks" }
tairitsu-macros = { git = "https://github.com/celestia-island/tairitsu.git", branch = "master", package = "tairitsu-macros" }
tairitsu-vdom = { git = "https://github.com/celestia-island/tairitsu.git", branch = "master", package = "tairitsu-vdom" }
tairitsu-web = { git = "https://github.com/celestia-island/tairitsu.git", branch = "master", package = "tairitsu-web", features = [
    "browser",
    "vdom",
    "wit-bindings",
], default-features = false }

anyhow = "1"

[package.metadata.tairitsu]
app-name = "kei webui"
title = "kei OS — Dashboard"
description = "Browser-based dashboard for kei OS, connecting via WebSocket JSON-RPC"

[package.metadata.tairitsu.build]
target = "component"
output_dir = "../../target/kei-webui-dist"
optimize = true
sourcemap = true

[package.metadata.tairitsu.dev]
port = 3000
hot-reload = true
open-browser = false

[package.metadata.tairitsu.html]
lang = "en"
charset = "UTF-8"
viewport = "width=device-width, initial-scale=1.0"
body_class = "hi-layout hi-layout-dark"

[workspace]
